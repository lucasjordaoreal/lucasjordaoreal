<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="112" viewBox="0 0 1000 112" role="img" aria-labelledby="title description">
  <title id="title">Keep exploring. Keep making.</title>
  <desc id="description">A quiet closing line with a softly traveling mint light and a small orbital accent.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#91CFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A8F0CD" stop-opacity=".6"/>
      <stop offset="1" stop-color="#91CFFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .light { animation: travel 11s ease-in-out infinite; }
      .orbit { animation: settle 14s ease-in-out infinite alternate; transform-origin: center; }
      @keyframes travel { 0%, 100% { transform: translateX(-340px); opacity: .35; } 50% { transform: translateX(340px); opacity: .8; } }
      @keyframes settle { from { transform: rotate(-8deg); opacity: .5; } to { transform: rotate(8deg); opacity: .95; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .light { transform: none; opacity: .55; } }
    </style>
  </defs>
  <text x="500" y="47" text-anchor="middle" fill="#8897AC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="2.3">KEEP EXPLORING. KEEP MAKING.</text>
  <path d="M92 78 H908" stroke="url(#line)" stroke-width="1"/>
  <circle cx="500" cy="78" r="2" fill="#A8F0CD" class="light"/>
  <g fill="none" stroke="#91CFFF" stroke-opacity=".42" class="orbit">
    <ellipse cx="500" cy="78" rx="18" ry="6"/>
    <circle cx="516" cy="77" r="1.8" fill="#A8F0CD" stroke="none"/>
  </g>
</svg>
