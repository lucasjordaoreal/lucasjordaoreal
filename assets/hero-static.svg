<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title description">
  <title id="title">Lucas Jordão — Software Developer</title>
  <desc id="description">A still deep navy ocean-inspired banner with the name Lucas Jordão, the title Software Developer, and a quiet orbital motif.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A192F"/>
      <stop offset=".62" stop-color="#102941"/>
      <stop offset="1" stop-color="#0A192F"/>
    </linearGradient>
    <radialGradient id="mintGlow"><stop offset="0" stop-color="#A8F0CD" stop-opacity=".2"/><stop offset="1" stop-color="#A8F0CD" stop-opacity="0"/></radialGradient>
    <radialGradient id="iceGlow"><stop offset="0" stop-color="#91CFFF" stop-opacity=".16"/><stop offset="1" stop-color="#91CFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="orbitStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8F0CD" stop-opacity=".7"/>
      <stop offset="1" stop-color="#91CFFF" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="360" rx="22" fill="url(#ocean)"/>
  <circle cx="815" cy="104" r="205" fill="url(#iceGlow)"/>
  <circle cx="694" cy="276" r="222" fill="url(#mintGlow)"/>
  <path d="M0 292 C180 264 274 329 432 296 S730 260 1000 296" fill="none" stroke="#91CFFF" stroke-opacity=".08"/>
